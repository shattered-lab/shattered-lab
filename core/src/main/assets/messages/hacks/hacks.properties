###what's new
hacks.shdchanges.title112=Shattered Lab 1.1.2
hacks.shdchanges.intro112=Changes from your feedback.
hacks.shdchanges.mega112=Scroll of mega upgrade
hacks.shdchanges.mega112_desc=A stack of scrolls can be spent in one go: after each upgrade the item list opens again until the scrolls run out. Close the list to stop.
hacks.shdchanges.fixes112=Fixes
hacks.shdchanges.fixes112_desc=- the wand of magic missile, the wand of frost and other wands no longer freeze the game at huge levels (+1 000 000 and more), in a mage's staff too
hacks.shdchanges.title111=Shattered Lab 1.1.1
hacks.shdchanges.intro111=A quick fix after 1.1.
hacks.shdchanges.fixes111=Fixes
hacks.shdchanges.fixes111_desc=- the bestiary now closes after you choose how to summon, so you can tap a cell right away\n- when a new version is out, its window now opens by itself once, not only as a glowing button
hacks.shdchanges.title11=Shattered Lab 1.1
hacks.shdchanges.intro11=Fixes based on player feedback, plus a few new things.
hacks.shdchanges.fixes11=Fixes
hacks.shdchanges.fixes11_desc=- dew from the shelf (x10, x100) now fills the waterskin by the right amount\n- summoned statues and guardians no longer crash the game\n- the sentry was removed from the bestiary: it could not be killed and sometimes crashed the game\n- "kill all" now finishes off ghouls that kept reviving each other\n- with infinite talent points, "distribute all randomly" no longer freezes the game
hacks.shdchanges.str11=Strength requirement
hacks.shdchanges.str11_desc=The grimoire workshop can change the strength requirement of weapons and armor, down to 1.
hacks.shdchanges.uk11=Ukrainian
hacks.shdchanges.uk11_desc=The mod is fully translated into Ukrainian.
hacks.shdchanges.reports11=Crash reports
hacks.shdchanges.reports11_desc=If the game crashes, it sends an anonymous report so the bug can be fixed quickly. You can turn this off in Settings, on the connection tab.
hacks.shdchanges.title=Shattered Lab 1.0
hacks.shdchanges.intro=Shattered Lab (formerly Shattered Hacked Dungeon), rebuilt from scratch on Shattered Pixel Dungeon 4.0.2.
hacks.shdchanges.library=Library on floor zero
hacks.shdchanges.library_desc=Every run starts in a library with every item in the game, sorted into rooms: potions, scrolls, weapons, armor, artifacts, enchantments, glyphs and more.\n\nTap an item to read its description and take 1, 10 or 100. The shelves never run out.
hacks.shdchanges.grimoire=Lab assistant's grimoire
hacks.shdchanges.grimoire_desc=Every cheat in one book:\n- workshop: any level, any enchantment or glyph, curse, charge\n- panel: immortality, one-hit kills, no hunger, full map, infinite charges\n- lift to any floor\n- monster summoning\n- talents: infinite points, reset, change subclass\n- ready-made gear kits
hacks.shdchanges.arena=Arena
hacks.shdchanges.arena_desc=At the bottom of the library there is an arena with training dummies that count damage, and a bestiary to summon any monster. Below it: a range with all 31 kinds of traps, a garden with every plant and endless wells of health and awareness.
hacks.shdchanges.items=New items
hacks.shdchanges.items_desc=Scroll of mega upgrade (+10), scroll of degradation, scroll of polymorph, wand of everything, a library card to teleport to the library and back, and a bag of holding with 20 slots. The mod section also has forgotten items: Lloyd's beacon and the cape of thorns.
hacks.shdchanges.qol=Quality of life
hacks.shdchanges.qol_desc=- grimoire button on screen, G key on PC\n- 9 quickslots instead of 6\n- all heroes, challenges and custom seeds unlocked\n- all potions, scrolls and rings identified from the start\n- no newbie tutorial and no guidebook on the floor\n- runs with cheats are marked in the rankings
