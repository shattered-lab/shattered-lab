hacks.hackreports.title=Crash reports
hacks.hackreports.body=If the game crashes, it sends an anonymous report to the Shattered Lab developer so the bug can be fixed. The report holds only technical details: where in the code the error happened, the phone model, the Android and game versions, and your last actions in the game (floor, hero, opened windows, used items). No name, contacts or other personal data. Reports are processed by Google Firebase Crashlytics.\n\nYou can turn sending off in Settings, on the connection tab.
