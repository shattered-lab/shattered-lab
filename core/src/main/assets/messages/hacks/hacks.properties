###mod items
hacks.items.scrollofdegradation.name=scroll of degradation
hacks.items.scrollofdegradation.inv_title=Degrade an item
hacks.items.scrollofdegradation.degraded=Item degraded: %1$s, level %2$d.
hacks.items.scrollofdegradation.desc=The opposite of a scroll of upgrade. Its magic removes one level from the chosen item, and the level can go below zero.\n\nCurse an item and degrade it a few times to make something truly awful. Why? Because you can.

hacks.items.scrollofpolymorph.name=scroll of polymorph
hacks.items.scrollofpolymorph.transformed=Enemies turned into sheep: %d.
hacks.items.scrollofpolymorph.nothing=There are no enemies nearby to transform.
hacks.items.scrollofpolymorph.desc=An ancient spell long gone from the dungeon. Every enemy in sight except bosses instantly turns into a harmless sheep. You still get experience for them.

hacks.items.librarycard.name=library card
hacks.items.librarycard.ac_go=TO LIBRARY
hacks.items.librarycard.ac_return=RETURN
hacks.items.librarycard.nowhere=There is nowhere to return to: go down into the dungeon first.
hacks.items.librarycard.preventing=Something is preventing teleportation!
hacks.items.librarycard.no_branch=The card does not work here.
hacks.items.librarycard.desc_set=Bookmark on floor %d.
hacks.items.librarycard.desc=A card for the library on floor zero. Use it in the dungeon to instantly travel to the library, leaving a bookmark where you were.\n\nIn the library, the card returns you to the bookmark. Without a bookmark it sends you to the stairs of the deepest floor you have visited.\n\nIt does not work during boss fights or in special areas like the mine.

hacks.items.bagofholding.name=bag of holding
hacks.items.bagofholding.desc=This bag is bigger on the inside. It holds 20 items of any kind.\n\nIt only fills up when your main backpack runs out of space, so your usual inventory layout stays the same.

