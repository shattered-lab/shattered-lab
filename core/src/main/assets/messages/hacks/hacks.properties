hacks.items.hackergrimoire.desc=Every cheat of the mod in one book: item workshop, cheat panel, floor lift, monster summoning, talents and ready-made gear kits.
hacks.items.bestiarybook.name=bestiary
hacks.items.bestiarybook.ac_summon=SUMMON
hacks.items.bestiarybook.desc=A book of every dungeon dweller. Summon any regular or rare monster next to you, as an enemy or an ally.\n\nBosses need their own arenas, so use the grimoire's lift to reach them.

