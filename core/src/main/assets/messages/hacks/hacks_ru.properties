###what's new
hacks.shdchanges.title11=Shattered Lab 1.1
hacks.shdchanges.intro11=Исправления по отзывам игроков и кое-что новое.
hacks.shdchanges.fixes11=Исправления
hacks.shdchanges.fixes11_desc=- роса с полки (x10, x100) теперь наполняет бурдюк на нужное количество\n- призванные статуи и стражи больше не роняют игру\n- из бестиария убран часовой: его нельзя было убить, и иногда он ронял игру\n- «убить всех» теперь добивает гулей, которые поднимали друг друга\n- при бесконечных очках талантов «распределить все случайно» больше не вешает игру
hacks.shdchanges.str11=Требование силы
hacks.shdchanges.str11_desc=В мастерской гримуара можно изменить требование силы оружия и брони, вплоть до 1.
hacks.shdchanges.uk11=Украинский язык
hacks.shdchanges.uk11_desc=Мод полностью переведён на украинский.
hacks.shdchanges.reports11=Отчёты об ошибках
hacks.shdchanges.reports11_desc=Если игра вылетит, она отправит анонимный отчёт, чтобы ошибку можно было быстро исправить. Выключается в настройках, на вкладке подключения.
hacks.shdchanges.title=Shattered Lab 1.0
hacks.shdchanges.intro=Shattered Lab (бывший Shattered Hacked Dungeon) написан заново на основе Shattered Pixel Dungeon 4.0.2.
hacks.shdchanges.library=Библиотека на нулевом этаже
hacks.shdchanges.library_desc=Забег начинается в библиотеке, где есть все предметы игры. Предметы разложены по комнатам: зелья, свитки, оружие, броня, артефакты, зачарования, глифы и другие.\n\nНажмите на предмет, чтобы прочитать описание и взять 1, 10 или 100 штук. Полки никогда не пустеют.
hacks.shdchanges.grimoire=Гримуар лаборанта
hacks.shdchanges.grimoire_desc=Все читы в одной книге:\n- мастерская: любой уровень, любое зачарование или глиф, проклятие, заряд\n- пульт: бессмертие, убийство с удара, без голода, открытая карта, бесконечные заряды\n- лифт на любой этаж\n- призыв монстров\n- таланты: бесконечные очки, сброс, смена подкласса\n- готовые наборы снаряжения
hacks.shdchanges.arena=Арена
hacks.shdchanges.arena_desc=Внизу библиотеки есть арена с тренировочными манекенами, которые считают урон, и бестиарий для призыва любых монстров. Под ареной полигон со всеми 31 видом ловушек, сад со всеми растениями и бесконечные колодцы здоровья и знания.
hacks.shdchanges.items=Новые предметы
hacks.shdchanges.items_desc=Свиток мегаулучшения (+10), свиток ухудшения, свиток полиморфа, палочка всего, читательский билет для телепорта в библиотеку и обратно и бездонная сумка на 20 ячеек. В разделе мода также лежат забытые предметы: маяк Ллойда и шипастый плащ.
hacks.shdchanges.qol=Удобство
hacks.shdchanges.qol_desc=- кнопка гримуара на экране, на ПК клавиша G\n- 9 быстрых слотов вместо 6\n- все герои, испытания и свой сид открыты сразу\n- все зелья, свитки и кольца опознаны с начала забега\n- без обучения для новичков и без путеводителя на полу\n- забеги с читами отмечены в рекордах
