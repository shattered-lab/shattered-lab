hacks.hackreports.title=Отчёты об ошибках
hacks.hackreports.body=Если игра вылетит, она отправит разработчику Shattered Lab анонимный отчёт, чтобы ошибку можно было исправить. В нём только техническая информация: где в коде случилась ошибка, модель телефона, версии Android и игры и последние действия в игре (этаж, герой, открытые окна, использованные предметы). Без имени, контактов и других личных данных. Отчёты обрабатывает Google Firebase Crashlytics.\n\nВыключить отправку можно в настройках, на вкладке подключения.
hacks.hackreports.ok=Понятно
hacks.hackreports.setting=Отправлять отчёты об ошибках
