###mod items
hacks.items.scrollofdegradation.name=свиток Ухудшения
hacks.items.scrollofdegradation.inv_title=Какой предмет ухудшить?
hacks.items.scrollofdegradation.degraded=Предмет ухудшен: %1$s, уровень %2$d.
hacks.items.scrollofdegradation.desc=Обратная сторона свитка Улучшения. Его магия отнимает у выбранного предмета один уровень, и уровень может уйти в минус.\n\nПрокляните предмет и ухудшите его несколько раз, и получите по-настоящему ужасную вещь. Зачем? Потому что можно.

hacks.items.scrollofpolymorph.name=свиток Полиморфа
hacks.items.scrollofpolymorph.transformed=Превращено в овец: %d.
hacks.items.scrollofpolymorph.nothing=Рядом нет врагов, которых можно превратить.
hacks.items.scrollofpolymorph.desc=Древнее заклинание, давно исчезнувшее из подземелья. Все враги в поле зрения, кроме боссов, мгновенно превращаются в безобидных овец. Опыт за них вы всё равно получите.

hacks.items.librarycard.name=читательский билет
hacks.items.librarycard.ac_go=В БИБЛИОТЕКУ
hacks.items.librarycard.ac_return=ВЕРНУТЬСЯ
hacks.items.librarycard.nowhere=Возвращаться некуда: сначала спуститесь в подземелье.
hacks.items.librarycard.preventing=Что-то мешает телепортации!
hacks.items.librarycard.no_branch=Здесь билет не работает.
hacks.items.librarycard.desc_set=Закладка на %d этаже.
hacks.items.librarycard.desc=Билет в библиотеку на нулевом этаже. Используйте его в подземелье, и вы мгновенно окажетесь в библиотеке, а на месте, откуда ушли, останется закладка.\n\nВ библиотеке билет возвращает вас к закладке. Если закладки нет, он отправит вас к лестнице самого глубокого этажа, где вы были.\n\nНе работает во время боя с боссом и в особых зонах вроде шахты.

hacks.items.bagofholding.name=бездонная сумка
hacks.items.bagofholding.desc=Сумка, которая внутри больше, чем снаружи. В ней 20 ячеек для любых предметов.\n\nСумка заполняется сама, когда в основном рюкзаке кончается место, так что привычная раскладка инвентаря не меняется.

