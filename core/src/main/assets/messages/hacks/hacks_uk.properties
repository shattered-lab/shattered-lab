hacks.items.hackergrimoire.desc=Усі чити моду в одній книзі: майстерня предметів, пульт читів, ліфт між поверхами, виклик монстрів, таланти й готові набори спорядження.
hacks.items.bestiarybook.name=бестіарій
hacks.items.bestiarybook.ac_summon=ВИКЛИКАТИ
hacks.items.bestiarybook.desc=Книга про всіх мешканців підземелля. Викличте поруч із собою будь-якого звичайного чи рідкісного монстра як ворога або союзника.\n\nБосам потрібні власні арени, тож до них простіше дістатися ліфтом із гримуара.

