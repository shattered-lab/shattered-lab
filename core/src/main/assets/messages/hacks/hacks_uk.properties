hacks.hackreports.body=Якщо гра вилетить, вона надішле розробникові Shattered Lab анонімний звіт, щоб помилку можна було виправити. У ньому лише технічна інформація: де в коді сталася помилка, модель телефону, версії Android і гри та останні дії в грі (поверх, герой, відкриті вікна, використані предмети). Без імені, контактів та інших особистих даних. Звіти обробляє Google Firebase Crashlytics.\n\nВимкнути надсилання можна в «Параметрах», на вкладці «З'єднання».
