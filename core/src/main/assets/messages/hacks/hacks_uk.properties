###what's new
hacks.shdchanges.title12=Shattered Lab 1.2
hacks.shdchanges.intro12=Світло, шейдери та об'ємний звук.
hacks.shdchanges.fx12=Звук, світло та шейдери
hacks.shdchanges.fx12_desc=Три нові перемикачі, усі вимкнені за замовчуванням:\n\n- _Об'ємний звук і луна_ (Відтворення звуку): звуки чути з того боку, де вони пролунали, у кімнатах, залах і печерах є луна, а звуки за дверима чи стіною приглушені.\n- _Динамічне світло_ (Екран): герой несе світло, смолоскипи, вогонь, блискавки та світні монстри освітлюють усе навколо.\n- _Шейдерні ефекти_ (Екран): сяйво вогню й магії, відображення у воді та ефекти екрана при низькому здоров'ї, невидимості, ясновидінні, отруєнні та голоді.\n\nСвітлу й шейдерам потрібен потужніший пристрій. Якщо вони не зможуть запуститися, то вимкнуться самі.\n\nДякуємо DenySilver (Reforged Pixel Dungeon) за світло й шейдери та GabriWar (Warped Pixel Dungeon) за об'ємний звук.
hacks.shdchanges.fixes12=Виправлення
hacks.shdchanges.fixes12_desc=- З величезним кільцем сили (+28 000 і більше) здоров'я більше не йде в мінус після лікування, і гра не зупиняється. Максимум здоров'я тепер не більше 1 000 000 000, а зламане здоров'я у старих збереженнях виправляється саме.
hacks.shdchanges.title112=Shattered Lab 1.1.2
hacks.shdchanges.intro112=Зміни за вашими відгуками.
hacks.shdchanges.mega112=Сувій мегапокращення
hacks.shdchanges.mega112_desc=Стос сувоїв можна витратити за одне прочитання: після кожного покращення список предметів відкривається знову, доки сувої не скінчаться. Закрийте список, щоб зупинитися.
hacks.shdchanges.fixes112=Виправлення
hacks.shdchanges.fixes112_desc=- жезли магічної стріли, морозу та інші більше не вішають гру на величезних рівнях (+1 000 000 і вище), у патериці теж
hacks.shdchanges.title111=Shattered Lab 1.1.1
hacks.shdchanges.intro111=Швидке виправлення після 1.1.
hacks.shdchanges.fixes111=Виправлення
hacks.shdchanges.fixes111_desc=- бестіарій закривається після вибору режиму виклику, і можна одразу натиснути на клітинку\n- коли виходить нова версія, вікно оновлення відкривається саме (один раз), а не лише блимає кнопка
hacks.shdchanges.title11=Shattered Lab 1.1
hacks.shdchanges.intro11=Виправлення за відгуками гравців і дещо нове.
hacks.shdchanges.fixes11=Виправлення
hacks.shdchanges.fixes11_desc=- роса з полиці (x10, x100) тепер наповнює бурдюк на потрібну кількість\n- викликані статуї та вартові більше не ламають гру\n- з бестіарію прибрано вартового: його не можна було вбити, і інколи він ламав гру\n- «вбити всіх» тепер добиває гулів, які піднімали одне одного\n- з нескінченними очками талантів «розподілити всі випадково» більше не вішає гру
hacks.shdchanges.str11=Вимога сили
hacks.shdchanges.str11_desc=У майстерні гримуара можна змінити вимогу сили для зброї та обладунків, аж до 1.
hacks.shdchanges.uk11=Українська мова
hacks.shdchanges.uk11_desc=Мод повністю перекладено українською.
hacks.shdchanges.reports11=Звіти про збої
hacks.shdchanges.reports11_desc=Якщо гра вилетить, вона надішле анонімний звіт, щоб помилку можна було швидко виправити. Вимикається в параметрах, на вкладці З'єднання.
hacks.shdchanges.title=Shattered Lab 1.0
hacks.shdchanges.intro=Shattered Lab (раніше Shattered Hacked Dungeon) переписано з нуля на основі Shattered Pixel Dungeon 4.0.2.
hacks.shdchanges.library=Бібліотека на нульовому поверсі
hacks.shdchanges.library_desc=Забіг починається в бібліотеці, де є всі предмети гри. Предмети розкладено по кімнатах: зілля, сувої, зброя, обладунки, артефакти, зачарування, руни та інше.\n\nТоркніться предмета, щоб прочитати опис і взяти 1, 10 або 100 штук. Полиці ніколи не порожніють.
hacks.shdchanges.grimoire=Гримуар лаборанта
hacks.shdchanges.grimoire_desc=Усі чити в одній книзі:\n- майстерня: будь-який рівень, будь-яке зачарування чи руна, прокляття, заряд\n- пульт: безсмертя, убивство з одного удару, без голоду, відкрита карта, нескінченні заряди\n- ліфт на будь-який поверх\n- виклик монстрів\n- таланти: нескінченні очки, скидання, зміна підкласу\n- готові набори спорядження
hacks.shdchanges.arena=Арена
hacks.shdchanges.arena_desc=У нижній частині бібліотеки є арена з тренувальними манекенами, які рахують шкоду, і бестіарій для виклику будь-яких монстрів. Під ареною: полігон з усіма 31 видом пасток, сад з усіма рослинами та невичерпні колодязі оздоровлення й пізнання.
hacks.shdchanges.items=Нові предмети
hacks.shdchanges.items_desc=Сувій мегапокращення (+10), сувій погіршення, сувій поліморфу, паличка всього, читацький квиток для телепорту до бібліотеки й назад і бездонна сумка на 20 комірок. У розділі моду також лежать забуті предмети: маяк телепортації та шипастий плащ.
hacks.shdchanges.qol=Зручність
hacks.shdchanges.qol_desc=- кнопка гримуара на екрані, на ПК клавіша G\n- 9 швидких комірок замість 6\n- усі герої, випробування й власний ключ доступні одразу\n- усі зілля, сувої й персні розпізнано від початку забігу\n- без навчання для новачків і без путівника на підлозі\n- забіги з читами позначено в рекордах
