###mod items
hacks.items.scrollofdegradation.name=сувій погіршення
hacks.items.scrollofdegradation.inv_title=Який предмет погіршити?
hacks.items.scrollofdegradation.degraded=Предмет погіршено: %1$s, рівень %2$d.
hacks.items.scrollofdegradation.desc=Протилежність сувою покращення. Його магія забирає в обраного предмета один рівень, і рівень може піти в мінус.\n\nПрокляніть предмет і кілька разів погіршіть його, щоб отримати справді жахливу річ. Навіщо? Бо можна.

hacks.items.scrollofpolymorph.name=сувій поліморфу
hacks.items.scrollofpolymorph.transformed=Перетворено на овець: %d.
hacks.items.scrollofpolymorph.nothing=Поруч немає ворогів, яких можна перетворити.
hacks.items.scrollofpolymorph.desc=Стародавнє закляття, яке давно зникло з підземелля. Усі вороги в полі зору, крім босів, миттєво перетворюються на нешкідливих овець. Досвід за них ви все одно отримаєте.

hacks.items.librarycard.name=читацький квиток
hacks.items.librarycard.ac_go=ДО БІБЛІОТЕКИ
hacks.items.librarycard.ac_return=ПОВЕРНУТИСЯ
hacks.items.librarycard.nowhere=Повертатися нікуди: спершу спустіться в підземелля.
hacks.items.librarycard.preventing=Щось заважає телепортації!
hacks.items.librarycard.no_branch=Тут квиток не працює.
hacks.items.librarycard.desc_set=Закладка на поверсі %d.
hacks.items.librarycard.desc=Квиток до бібліотеки на нульовому поверсі. Скористайтеся ним у підземеллі, і ви миттєво опинитеся в бібліотеці, а там, звідки ви пішли, залишиться закладка.\n\nУ бібліотеці квиток повертає вас до закладки. Якщо закладки немає, він перенесе вас до сходів найглибшого поверху, де ви побували.\n\nНе працює під час бою з босом і в особливих зонах на кшталт шахти.

hacks.items.bagofholding.name=бездонна сумка
hacks.items.bagofholding.desc=Ця сумка всередині більша, ніж зовні. У ній 20 комірок для будь-яких предметів.\n\nСумка заповнюється сама, коли в основному рюкзаку закінчується місце, тож звичне розкладання інвентарю не змінюється.

